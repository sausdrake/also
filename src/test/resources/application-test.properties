# H2 Database for tests
# TEST-ISO-01: one in-memory database per Spring context. A shared name let a closing context's
# create-drop drop the schema under every other cached context ("this database is empty").
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,YEAR,MONTH,DAY,HOUR,MINUTE,SECOND
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console
spring.h2.console.enabled=true

# JPA — let Hibernate create schema in tests (no Flyway)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway disabled for tests (H2 uses ddl-auto instead)
spring.flyway.enabled=false

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# CORS
allowed.origins=http://localhost:5173

# Media (tests use temp dir)
media.upload.dir=target/test-uploads
media.base-url=http://localhost:8080/uploads

# Auction scheduler confirmation hours
auction.confirm.hours=2

# Misc
failed.operations.enabled=false

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.example.autoauction=DEBUG
logging.level.org.hibernate.SQL=DEBUG
