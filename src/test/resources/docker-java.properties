# Test-only Docker client compatibility (migration-repair verification track).
#
# Docker Engine 29.x requires clients to negotiate Docker API >= 1.44. The docker-java 3.3.6
# bundled by Testcontainers 1.19.8 sends an older default and Docker Engine 29.x rejects the
# /info handshake with HTTP 400 ("Could not find a valid Docker environment"). Pinning the API
# version here is the documented workaround for pre-2.0 Testcontainers (upstream fix is
# Testcontainers 2.0.2, which requires Spring Boot 4).
#
# This is NOT a dependency change and NOT production configuration - it only affects how the
# test JVM talks to the local Docker daemon.
api.version=1.44
