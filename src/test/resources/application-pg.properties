# Slice 2: PostgreSQL (Testcontainers) test profile for financial money-path tests.
#
# Activated together with the "test" profile (@ActiveProfiles({"test","pg"})) so that the
# existing test doubles stay in effect (FakeStorageClient / FakeVideoProcessor are @Profile("test");
# R2StorageClient is @Profile("!test") and stays disabled). This profile is listed last, so it
# overrides ONLY the database layer:
#
#   * real PostgreSQL 16 via Testcontainers (@ServiceConnection supplies the datasource -
#     no url/username/password here),
#   * Flyway ENABLED -> the real migration chain V1..V42 runs against PostgreSQL,
#   * Hibernate validates (never shapes) the schema,
#   * PostgreSQL dialect.
#
# Everything else (JWT test secret, media temp dirs, failed.operations.enabled=false, cache,
# logging) is inherited unchanged from application-test.properties.

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
# TEST-01: no background @Scheduled jobs - all PostgreSQL test classes share one database
# (singleton container), and a job of one cached context must not act on another class's rows
also.scheduling.enabled=false
