spring.application.name=autoauction
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/auto_auction
spring.datasource.username=auto_auction_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA — schema managed by Flyway, Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.indent_output=true
# Сериализация дат как ISO строки (не массивы), с наносекундами → до миллисекунд
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.example.autoauction
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.auto-tag-classes=true
springdoc.show-actuator=false

# JWT
# Secret is supplied exclusively via the JWT_SECRET environment variable.
# There is no hardcoded fallback. The application will not start if this
# variable is absent or shorter than 32 bytes (256 bits).
# Generate a value with: openssl rand -hex 32
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# CORS — list of allowed origins (comma-separated)
allowed.origins=http://localhost:5173,http://localhost:3000

# Media upload (MVP: local storage)
media.upload.dir=uploads
media.base-url=http://localhost:8081/uploads

# MEDIA-3.2: Cloudflare R2 (S3-compatible). Credentials supplied exclusively
# via environment variables - no hardcoded fallback, same convention as
# JWT_SECRET/DB_PASSWORD.
r2.account-id=${R2_ACCOUNT_ID}
r2.bucket=${R2_BUCKET}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}

# Diagnostic media policy (MEDIA-3.2)
diagnostic.media.upload-ttl-minutes=15
diagnostic.media.read-url-ttl-minutes=10
diagnostic.media.max-size-bytes=209715200
diagnostic.media.reconciliation.pending-upload-expiry-minutes=60

# Auction extension settings
auction.extension.enabled=true
auction.extension.threshold-seconds=300
auction.extension.extension-minutes=5
auction.extension.max-extensions=0
auction.extension.min-auction-duration-minutes=1
auction.extension.max-auction-duration-days=30
auction.extension.min-hours-before-start=0
auction.extension.min-bid-step-percentage=1.0

# Logging
logging.file.name=logs/autoauction.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=2GB

logging.level.com.example.autoauction=INFO
logging.level.com.example.autoauction.auction=DEBUG
logging.level.com.example.autoauction.auth=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.flywaydb=INFO

logging.pattern.console=%clr(%d{dd-MM-yyyy HH:mm:ss.SSS}){faint} %clr(%-5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n
logging.pattern.file=%d{dd-MM-yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
