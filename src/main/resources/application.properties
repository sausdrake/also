spring.application.name=autoauction

# ??????????? ? ???????????? ??
spring.datasource.url=jdbc:postgresql://localhost:5432/auto_auction
spring.datasource.username=auto_auction_user
spring.datasource.password=auto_auction_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate ?????????
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson ?????????
spring.jackson.serialization?.indent_output=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.example.autoauction

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000

logging.file.name=logs/autoauction-${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.total-size-cap=2GB

logging.level.com.example.autoauction.auction=DEBUG
logging.level.com.example.autoauction.bid=DEBUG
logging.level.com.example.autoauction.vehicle=INFO
logging.level.com.example.autoauction.user=INFO
logging.level.com.example.autoauction.auth=DEBUG
logging.level.com.example.autoauction.diagnostic=INFO
logging.level.com.example.autoauction.admin=INFO


logging.group.auction=com.example.autoauction.auction,com.example.autoauction.bid
logging.group.users=com.example.autoauction.user,com.example.autoauction.auth
logging.level.auction=DEBUG
logging.level.users=INFO


logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.transaction=INFO

# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.pattern.file=%d{dd-MM-yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n


# ????????? ???????? ????? ??? ??????????
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

# ???????????? ?????? ??? ????????
springdoc.auto-tag-classes=true
springdoc.show-actuator=false

# ??? ???????
logging.level.org.springdoc=DEBUG
# ????????? ????????? ????????
auction.extension.minutes=5
auction.extension.threshold-minutes=5
logging.pattern.console=%clr(%d{dd-MM-yyyy HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}

# ????????? ????????? ????????
auction.extension.enabled=true
auction.extension.threshold-seconds=30
auction.extension.extension-minutes=5
auction.extension.max-extensions=0

# ????????? ????????? ????????
auction.extension.min-auction-duration-minutes=1
auction.extension.max-auction-duration-days=30
auction.extension.min-hours-before-start=1
auction.extension.min-bid-step-percentage=1.0