# CFG-01: production profile (SPRING_PROFILES_ACTIVE=prod). Only overrides what must differ from
# application.properties; every secret still comes from the environment. ProductionProfileGuard
# refuses to start with a development-only value (dev/test profile, weak or public JWT secret,
# wildcard/localhost/non-https origins or media URL).

# API documentation is for development only
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# No DEBUG logging of authentication, bidding or WebSocket traffic in production
logging.level.com.example.autoauction=INFO
logging.level.com.example.autoauction.auction=INFO
logging.level.com.example.autoauction.auth=INFO
logging.level.org.springframework.web.socket=INFO
spring.jackson.serialization.indent_output=false

# Required, no defaults: the production SPA origin(s), comma-separated, and the public media URL
allowed.origins=${ALLOWED_ORIGINS}
media.base-url=${MEDIA_BASE_URL}
