version: '3.8'

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: autoauction-postgres
    environment:
      POSTGRES_DB: auto_auction
      POSTGRES_USER: auto_auction_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_auction_user -d auto_auction"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autoauction-network

  # Приложение Spring Boot
  app:
    build: .
    container_name: autoauction-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auto_auction
      SPRING_DATASOURCE_USERNAME: auto_auction_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      # CFG-01: production profile - swagger off, INFO logs, startup guard (see .env.example)
      SPRING_PROFILES_ACTIVE: prod
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    ports:
      - "8081:8081"
    # MEDIA-05: uploaded media and log files live outside the container - without these volumes
    # every deploy (container re-creation) deleted all uploaded photos and videos
    volumes:
      - media_uploads:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - autoauction-network

volumes:
  postgres_data:
  media_uploads:
  app_logs:

networks:
  autoauction-network:
    driver: bridge